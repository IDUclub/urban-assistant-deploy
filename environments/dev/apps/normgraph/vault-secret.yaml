apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: normgraph-secrets
spec:
  vaultAuthRef: urban-assistant-dev
  mount: urban-assistant-kv
  type: kv-v2
  path: dev/normgraph
  refreshAfter: 1m
  hmacSecretData: true
  destination:
    create: true
    overwrite: false
    name: normgraph-secrets
    type: Opaque
    transformation:
      excludes: [".*"]
      templates:
        NG_NEO4J_URI:
          text: '{{ get .Secrets "ng_neo4j_uri" }}'
        NG_OLLAMA_BASE:
          text: '{{ get .Secrets "ng_ollama_base" }}'
        NG_EMBEDDINGS_URL:
          text: '{{ get .Secrets "ng_embeddings_url" }}'
        NG_SERVICE_AUTH_SERVER_URL:
          text: '{{ get .Secrets "ng_service_auth_server_url" }}'
        NG_NEO4J_USER:
          text: '{{ get .Secrets "neo4j_user" }}'
        NG_NEO4J_PASSWORD:
          text: '{{ get .Secrets "neo4j_password" }}'
        NG_SERVICE_AUTH_CLIENT_SECRET:
          text: '{{ get .Secrets "service_auth_client_secret" }}'
  rolloutRestartTargets:
    - kind: Deployment
      name: normgraph

# Vault runs outside Kubernetes. The chart installs only VSO and its CRDs.
defaultVaultConnection:
  enabled: false
defaultAuthMethod:
  enabled: false

controller:
  manager:
    clientCache:
      persistenceModel: none
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 300m
        memory: 256Mi

# Argo CD applies the CRDs from the chart directly. A Helm pre-upgrade hook
# would be translated to a PreSync hook and run during every GitOps adoption.
hooks:
  upgradeCRDs:
    enabled: false

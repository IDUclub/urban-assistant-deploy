apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: urban-assistant-dev
  namespace: urban-assistant-dev
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyDeployment:
        replicas: 1
      envoyService:
        name: urban-assistant-dev-gateway
        type: NodePort
        externalTrafficPolicy: Cluster
        patch:
          type: StrategicMerge
          value:
            spec:
              ports:
                - name: http-80
                  protocol: TCP
                  port: 80
                  targetPort: 10080
                  nodePort: 31301
                - name: https-443
                  protocol: TCP
                  port: 443
                  targetPort: 10443
                  nodePort: 31302
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: urban-assistant-dev
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
  parametersRef:
    group: gateway.envoyproxy.io
    kind: EnvoyProxy
    name: urban-assistant-dev
    namespace: urban-assistant-dev

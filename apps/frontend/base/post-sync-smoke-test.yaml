# Generated by scripts/generate-smoke-tests.py; edit services.yaml or scripts/smoke-probe.py.
apiVersion: batch/v1
kind: Job
metadata:
  name: frontend-smoke-test
  labels:
    app.kubernetes.io/name: frontend-smoke-test
    app.kubernetes.io/component: smoke-test
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frontend-smoke-test
        app.kubernetes.io/component: smoke-test
    spec:
      restartPolicy: Never
      enableServiceLinks: false
      automountServiceAccountToken: false
      containers:
        - name: smoke-test
          image: urban-assistant/frontend:base
          imagePullPolicy: IfNotPresent
          command:
            - node
            - --input-type=module
            - -e
          args:
            - |
              // Embedded in the frontend PostSync Job; use the released image's Node runtime.
              const checks = JSON.parse(process.env.SMOKE_CHECKS);
              if (!Array.isArray(checks) || checks.length === 0) throw new Error("Empty smoke checks");
              for (let attempt = 1; attempt <= 12; attempt++) {
                try {
                  for (const probe of checks) {
                    const response = await fetch(probe.url, {
                      redirect: "error", signal: AbortSignal.timeout(5000),
                    });
                    if (response.status !== 200) throw new Error("HTTP " + response.status);
                    const body = await response.text();
                    if (!body.trim() || !body.toLowerCase().includes(probe.contains.toLowerCase())) {
                      throw new Error("Unexpected frontend response");
                    }
                    console.log("PASS " + probe.url);
                  }
                  process.exit(0);
                } catch (error) {
                  console.error("FAIL attempt=" + attempt + " (" + error.name + ")");
                  if (attempt === 12) process.exit(1);
                  await new Promise(resolve => setTimeout(resolve, 5000));
                }
              }
          env:
            - name: SMOKE_CHECKS
              value: '[{"url":"http://urban-assistant-frontend:3000/","contains":"<html"}]'
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault

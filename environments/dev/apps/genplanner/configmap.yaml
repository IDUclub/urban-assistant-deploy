apiVersion: v1
kind: ConfigMap
metadata:
  name: genplanner-env-file
data:
  .env.development: |
    URBAN_API=http://urban-api:8000
    TEST_URBAN_API=http://urban-api:8000
    MAX_API_ASYNC_EXTRACTIONS=4
    LOG_FILE=/tmp/genplanner/genplanner.log
    LOG_LEVEL=INFO
    CHAT_MODEL=gpt-oss-20b
    GENERATE_MODEL=gpt-oss-20b
    CHAT_STORAGE_BASE_URL=http://chat-storage:8000
    CHAT_STORAGE_TIMEOUT_SECONDS=30
    KEYCLOAK_REALM=IDU
    KEYCLOAK_CLIENT_ID=genplanner
    KEYCLOAK_SCOPE=openid
    GENPLANNER_API_BASE_URL=http://genplanner:8080
    MCP_SERVER_HOST=0.0.0.0
    MCP_SERVER_PORT=8766
    MCP_UPSTREAM_TIMEOUT_SECONDS=120

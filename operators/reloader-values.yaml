reloader:
  # Only ConfigMaps in urban-assistant-dev are watched. Vault Secrets Operator
  # already restarts workloads when a Vault-backed Secret changes.
  watchGlobally: false
  ignoreSecrets: true
  ignoreJobs: true
  ignoreCronJobs: true

  # Annotation-based restarts produce less GitOps drift than injected env vars.
  reloadStrategy: annotations

  deployment:
    replicas: 1
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 256Mi

apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: idu-dvd-secrets
spec:
  vaultAuthRef: urban-assistant-dev
  mount: urban-assistant-kv
  type: kv-v2
  path: dev/idu-dvd
  refreshAfter: 1m
  hmacSecretData: true
  destination:
    create: true
    overwrite: false
    name: idu-dvd-secrets
    type: Opaque
    transformation:
      excludes: [".*"]
      templates:
        REDIS_PASSWORD:
          text: '{{ get .Secrets "redis_password" }}'
        DVD_REDIS_URL:
          text: 'redis://:{{ get .Secrets "redis_password" }}@idu-dvd-redis:6379/0'
        DVD_OLLAMA_BASE:
          text: '{{ get .Secrets "dvd_ollama_base" }}'
        DVD_EMBEDDINGS_URL:
          text: '{{ get .Secrets "dvd_embeddings_url" }}'
        DVD_QDRANT_URL:
          text: '{{ get .Secrets "dvd_qdrant_url" }}'
        DVD_MINIO_ENDPOINT:
          text: '{{ get .Secrets "dvd_minio_endpoint" }}'
        DVD_SERVICE_AUTH_SERVER_URL:
          text: '{{ get .Secrets "dvd_service_auth_server_url" }}'
        DVD_AUTH_HELPER_URL:
          text: '{{ get .Secrets "dvd_auth_helper_url" }}'
        DVD_MINIO_ACCESS_KEY:
          text: '{{ get .Secrets "fs_access_key" }}'
        DVD_MINIO_SECRET_KEY:
          text: '{{ get .Secrets "fs_secret_key" }}'
        DVD_SERVICE_AUTH_CLIENT_SECRET:
          text: '{{ get .Secrets "service_auth_client_secret" }}'
        DVD_AUTH_HELPER_API_KEY:
          text: '{{ get .Secrets "auth_helper_api_key" }}'
  rolloutRestartTargets:
    - kind: Deployment
      name: idu-dvd
    - kind: StatefulSet
      name: idu-dvd-redis

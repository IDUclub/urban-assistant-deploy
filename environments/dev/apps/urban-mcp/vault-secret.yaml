apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: urban-mcp-config
spec:
  vaultAuthRef: urban-assistant-dev
  mount: urban-assistant-kv
  type: kv-v2
  # Urban MCP uses the same urban_db and fileserver credentials as Urban API.
  path: dev/urban-api
  refreshAfter: 1m
  hmacSecretData: true
  destination:
    create: true
    overwrite: false
    name: urban-mcp-config
    type: Opaque
    transformation:
      excludes: [".*"]
      templates:
        config.yaml:
          text: |
            app:
              debug: false
              uvicorn:
                host: 0.0.0.0
                port: 8001
                reload: false
                forwarded_allow_ips: []
            db:
              master:
                host: {{ get .Secrets "db_host" | quote }}
                port: {{ get .Secrets "db_port" }}
                database: urban_db
                user: {{ get .Secrets "db_user" | quote }}
                password: {{ get .Secrets "db_password" | quote }}
                pool_size: 10
                debug: false
              replicas: []
            auth:
              verify: true
              server_url: {{ get .Secrets "auth_server_url" | quote }}
              client_id: urban-mcp
              verify_aud: false
              valid_audiences: []
            fileserver:
              url: {{ get .Secrets "fileserver_url" | quote }}
              projects_bucket: urban-api.dev
              access_key: {{ get .Secrets "fs_access_key" | quote }}
              secret_key: {{ get .Secrets "fs_secret_key" | quote }}
              region_name: us-east-1
              connect_timeout: 3
              read_timeout: 20
            observability:
              logging:
                root_logger_level: INFO
                stderr_level: INFO
                files: []
                exporter:
                  endpoint: http://otel-collector.monitoring.svc.cluster.local:4317
                  level: INFO
                  tls_insecure: true
              prometheus:
                host: 0.0.0.0
                port: 9090
              jaeger:
                endpoint: http://otel-collector.monitoring.svc.cluster.local:4318/v1/traces
            broker:
              client_id: urban-mcp
              bootstrap_servers: urban-assistant-kafka-kafka-bootstrap.kafka.svc.cluster.local:9092
              schema_registry_url: http://schema-registry.kafka.svc.cluster.local:8081
              enable_idempotence: true
              max_in_flight: 5
  rolloutRestartTargets:
    - kind: Deployment
      name: urban-mcp

apiVersion: apps/v1
kind: Deployment
metadata:
  name: pzz-compare
  annotations:
    configmap.reloader.stakater.com/reload: pzz-compare-config
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pzz-compare
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pzz-compare
        app.kubernetes.io/component: api
    spec:
      enableServiceLinks: false
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
        - name: init-runtime-dirs
          image: urban-assistant/pzz-compare:base
          imagePullPolicy: IfNotPresent
          command: ["sh", "-ec", "mkdir -p /runtime/outputs /runtime/task_inputs /runtime/uploads"]
          volumeMounts:
            - name: runtime
              mountPath: /runtime
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      containers:
        - name: api
          image: urban-assistant/pzz-compare:base
          imagePullPolicy: IfNotPresent
          command: ["sh", "-ec"]
          args:
            - python service/wait_for_db.py && exec uvicorn service.app:app --host 0.0.0.0 --port 8000
          envFrom:
            - configMapRef:
                name: pzz-compare-config
            - secretRef:
                name: pzz-compare-secrets
          ports:
            - name: http
              containerPort: 8000
          volumeMounts:
            - name: runtime
              mountPath: /app/outputs
              subPath: outputs
            - name: runtime
              mountPath: /app/task_inputs
              subPath: task_inputs
            - name: runtime
              mountPath: /app/uploads
              subPath: uploads
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 120
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /readiness
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 45
            periodSeconds: 20
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: runtime
          persistentVolumeClaim:
            claimName: pzz-runtime-data
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pzz-worker
  annotations:
    configmap.reloader.stakater.com/reload: pzz-compare-config
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pzz-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pzz-worker
        app.kubernetes.io/component: worker
    spec:
      enableServiceLinks: false
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
        - name: init-runtime-dirs
          image: urban-assistant/pzz-compare:base
          imagePullPolicy: IfNotPresent
          command: ["sh", "-ec", "mkdir -p /runtime/outputs /runtime/task_inputs /runtime/uploads"]
          volumeMounts:
            - name: runtime
              mountPath: /runtime
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      containers:
        - name: worker
          image: urban-assistant/pzz-compare:base
          imagePullPolicy: IfNotPresent
          command: ["sh", "-ec"]
          args:
            - python service/wait_for_db.py && exec celery -A service.tasks.celery_app worker -P threads --concurrency=4 -Q default --loglevel=INFO
          envFrom:
            - configMapRef:
                name: pzz-compare-config
            - secretRef:
                name: pzz-compare-secrets
          ports:
            - name: metrics
              containerPort: 9100
          volumeMounts:
            - name: runtime
              mountPath: /app/outputs
              subPath: outputs
            - name: runtime
              mountPath: /app/task_inputs
              subPath: task_inputs
          readinessProbe:
            exec:
              command: ["sh", "-ec", "celery -A service.tasks.celery_app inspect ping -d celery@$HOSTNAME | grep -q pong"]
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 10
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: runtime
          persistentVolumeClaim:
            claimName: pzz-runtime-data
---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: urban-mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: urban-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: urban-mcp
        app.kubernetes.io/component: mcp
    spec:
      enableServiceLinks: false
      automountServiceAccountToken: false
      containers:
        - name: mcp
          image: urban-assistant/urban-mcp:base
          imagePullPolicy: IfNotPresent
          env:
            - name: MCP_CONFIG_PATH
              value: /app/config.yaml
          ports:
            - name: http
              containerPort: 8001
            - name: metrics
              containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /app/config.yaml
              subPath: config.yaml
              readOnly: true
            - name: logs
              mountPath: /app/logs
          startupProbe:
            tcpSocket:
              port: http
            failureThreshold: 120
            periodSeconds: 5
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 45
            periodSeconds: 20
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              cpu: "4"
              memory: 6Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: config
          secret:
            secretName: urban-mcp-config
        - name: logs
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: urban-mcp
  labels:
    app.kubernetes.io/monitor: urban-mcp
spec:
  selector:
    app.kubernetes.io/name: urban-mcp
  ports:
    - name: http
      port: 8001
      targetPort: http
    - name: metrics
      port: 9090
      targetPort: metrics
---
apiVersion: v1
kind: Service
metadata:
  name: urban-mcp-dev
spec:
  type: NodePort
  externalTrafficPolicy: Cluster
  selector:
    app.kubernetes.io/name: urban-mcp
  ports:
    - name: http
      port: 8001
      targetPort: http
      nodePort: 31054

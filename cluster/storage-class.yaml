apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: urban-assistant-nfs
provisioner: nfs.csi.k8s.io
parameters:
  # Environment overlays replace these neutral defaults.
  server: nfs.invalid
  share: /srv/urban-assistant
  subDir: '${pvc.metadata.namespace}-${pvc.metadata.name}-${pv.metadata.name}'
  onDelete: retain
reclaimPolicy: Retain
allowVolumeExpansion: true
volumeBindingMode: Immediate
mountOptions:
  - hard
  - timeo=600
  - retrans=2

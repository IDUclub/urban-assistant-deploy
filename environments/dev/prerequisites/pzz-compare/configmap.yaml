apiVersion: v1
kind: ConfigMap
metadata:
  name: pzz-compare-config
data:
  # Bootstrap values consumed before idu-config loads the mounted dotenv file.
  # MCP reads os.environ directly, so its settings also stay here.
  APP_ENV: development
  LOG_LEVEL: INFO
  DB_WAIT_TIMEOUT: "60"
  DB_WAIT_INTERVAL: "2"
  MCP_API_BASE_URL: http://pzz-compare:8000
  MCP_HOST: 0.0.0.0
  MCP_PORT: "8765"
  MCP_WORKERS: "1"

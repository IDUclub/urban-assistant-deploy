# Vault runs outside Kubernetes. The chart installs only VSO and its CRDs.
defaultVaultConnection:
  enabled: false
defaultAuthMethod:
  enabled: false

controller:
  manager:
    clientCache:
      persistenceModel: none
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 300m
        memory: 256Mi

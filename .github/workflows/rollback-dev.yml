name: Roll back dev images

on:
  workflow_dispatch:
    inputs:
      service:
        description: Service to roll back (services.yaml name)
        type: choice
        required: true
        options:
          - urban-api
          - urban-mcp
          - frontend
          - chat-storage
          - genbuilder
          - genplanner
          - gmart
          - idu-dvd
          - normgraph
          - object-effects
          - pzz-compare
          - scenarios-conductor
      revision:
        description: Full DEPLOY repository commit SHA containing the working images
        type: string
        required: true
      reason:
        description: Reason; confirm compatibility with current config and database before merging
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: promote-dev-${{ inputs.service }}
  cancel-in-progress: false

jobs:
  rollback:
    if: github.ref == 'refs/heads/main'
    runs-on: 47_runner
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependency
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.3

      - name: Prepare atomic rollback from merged history
        id: rollback
        env:
          SERVICE: ${{ inputs.service }}
          REVISION: ${{ inputs.revision }}
          REASON: ${{ inputs.reason }}
        run: |
          python scripts/rollback-image.py --root . \
            --service "$SERVICE" --revision "$REVISION" --reason "$REASON" \
            --payload-output "$RUNNER_TEMP/rollback-payload.json" \
            --body-output "$RUNNER_TEMP/rollback-body.md" \
            --github-output "$GITHUB_OUTPUT"

      - name: Verify all historical digests still exist
        env:
          REGISTRY_SCHEME: https
          REGISTRY_INSECURE_TLS: "true"
        run: |
          PAYLOAD_JSON="$(<"$RUNNER_TEMP/rollback-payload.json")"
          export PAYLOAD_JSON
          bash scripts/verify-registry-digests.sh

      - name: Create deploy-repository write token
        id: deploy-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.DEPLOY_BOT_APP_ID }}
          private-key: ${{ secrets.DEPLOY_BOT_PRIVATE_KEY }}
          owner: IDUclub
          repositories: urban-assistant-deploy

      - name: Create PR for manual review and merge
        id: pull-request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.deploy-token.outputs.token }}
          base: main
          branch: rollback/dev-${{ inputs.service }}-${{ github.run_id }}-${{ github.run_attempt }}
          add-paths: ${{ steps.rollback.outputs.overlay }}
          title: 'rollback(dev): ${{ inputs.service }} to ${{ inputs.revision }}'
          commit-message: 'rollback(dev): ${{ inputs.service }} to ${{ inputs.revision }}'
          body-path: ${{ runner.temp }}/rollback-body.md

      - name: Show rollback PR
        env:
          PR_URL: ${{ steps.pull-request.outputs.pull-request-url }}
        run: printf 'Review and merge manually. Rollback PR — %s\n' "$PR_URL" >> "$GITHUB_STEP_SUMMARY"

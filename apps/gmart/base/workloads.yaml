apiVersion: apps/v1
kind: Deployment
metadata:
  name: gmart
  annotations:
    configmap.reloader.stakater.com/reload: gmart-config
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gmart
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gmart
        app.kubernetes.io/component: api-ui
    spec:
      enableServiceLinks: false
      automountServiceAccountToken: false
      containers:
        - name: app
          image: urban-assistant/gmart-agents:base
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: gmart-config
            - secretRef:
                name: gmart-secrets
          ports:
            - name: http
              containerPort: 8080
          startupProbe:
            httpGet:
              path: /ping
              port: http
            failureThreshold: 60
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /ping
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gmart-mcp
  annotations:
    configmap.reloader.stakater.com/reload: gmart-config
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gmart-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gmart-mcp
        app.kubernetes.io/component: mcp
    spec:
      enableServiceLinks: false
      automountServiceAccountToken: false
      containers:
        - name: mcp
          image: urban-assistant/gmart-mcp:base
          imagePullPolicy: IfNotPresent
          env:
            - name: PORT
              value: "8000"
          envFrom:
            - configMapRef:
                name: gmart-config
            - secretRef:
                name: gmart-secrets
          ports:
            - name: http
              containerPort: 8000
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 60
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gmart-context-worker
  annotations:
    configmap.reloader.stakater.com/reload: gmart-config
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gmart-context-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gmart-context-worker
        app.kubernetes.io/component: worker
    spec:
      enableServiceLinks: false
      automountServiceAccountToken: false
      containers:
        - name: worker
          image: urban-assistant/gmart-agents:base
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "src.agents.workers.context_worker"]
          envFrom:
            - configMapRef:
                name: gmart-config
            - secretRef:
                name: gmart-secrets
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
---
apiVersion: v1
kind: Service
metadata:
  name: gmart
spec:
  selector:
    app.kubernetes.io/name: gmart
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: gmart-dev
spec:
  type: NodePort
  externalTrafficPolicy: Cluster
  selector:
    app.kubernetes.io/name: gmart
  ports:
    - name: http
      port: 8080
      targetPort: http
      nodePort: 31004
---
apiVersion: v1
kind: Service
metadata:
  name: gmart-mcp
spec:
  selector:
    app.kubernetes.io/name: gmart-mcp
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: gmart-mcp-dev
spec:
  type: NodePort
  externalTrafficPolicy: Cluster
  selector:
    app.kubernetes.io/name: gmart-mcp
  ports:
    - name: http
      port: 8000
      targetPort: http
      nodePort: 31051

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dev-cluster-foundation
  namespace: argocd
  annotations: {argocd.argoproj.io/sync-wave: "-30"}
spec:
  project: urban-assistant-platform
  source:
    repoURL: https://github.com/IDUclub/urban-assistant-deploy.git
    targetRevision: main
    path: environments/dev/cluster
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated: {enabled: true, prune: true, selfHeal: true, allowEmpty: false}
    syncOptions: [ApplyOutOfSyncOnly=true, ServerSideApply=true]
---

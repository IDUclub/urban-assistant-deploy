apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-auth
  namespace: urban-assistant-dev
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: vault-auth-urban-assistant-dev-tokenreview
# The external Vault auth mount has no long-lived token_reviewer_jwt and uses
# the caller's short-lived JWT for TokenReview. In that mode this binding is
# required. Remove it only after Vault is configured with a dedicated reviewer.
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - kind: ServiceAccount
    name: vault-auth
    namespace: urban-assistant-dev
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultConnection
metadata:
  name: external-vault
  namespace: urban-assistant-dev
spec:
  # Environment overlays replace this neutral address.
  address: http://vault.invalid:8200
  skipTLSVerify: false
  timeout: 10s
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: urban-assistant-dev
  namespace: urban-assistant-dev
spec:
  vaultConnectionRef: external-vault
  method: kubernetes
  mount: kubernetes-urban-assistant-dev
  kubernetes:
    role: urban-assistant-dev
    serviceAccount: vault-auth
    audiences:
      - vault
      - https://kubernetes.default.svc.cluster.local
    tokenExpirationSeconds: 600

apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: urban-assistant-apps
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-50"
spec:
  description: Namespaced Urban Assistant application workloads
  sourceRepos:
    - https://github.com/IDUclub/urban-assistant-deploy.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: urban-assistant-dev
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
  clusterResourceWhitelist: []
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: urban-assistant-platform
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-50"
spec:
  description: Urban Assistant platform resources and scoped dependencies
  sourceRepos:
    - "*"
  destinations:
    - server: https://kubernetes.default.svc
      namespace: "*"
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"

apiVersion: v1
kind: ConfigMap
metadata:
  name: idu-dvd-config
data:
  DVD_LLM_PROVIDER: ollama
  DVD_OLLAMA_MODEL: gpt-oss:20b
  DVD_OLLAMA_EMBED_MODEL: bge-m3
  DVD_EMBEDDINGS_PROVIDER: giga
  DVD_EMBEDDINGS_MODEL: ai-sage/Giga-Embeddings-instruct
  DVD_QDRANT_COLLECTION: documents
  DVD_COLLECTION_NAMESPACING: "true"
  DVD_URBAN_API_URL: http://urban-api:8000
  DVD_MINIO_SECURE: "false"
  DVD_MINIO_BUCKET_DOCUMENTS: dvd-documents.dev
  DVD_MINIO_BUCKET_USER_DOCUMENTS: dvd-user-documents.dev
  DVD_KAFKA_BOOTSTRAP_SERVERS: urban-assistant-kafka-kafka-bootstrap.kafka.svc.cluster.local:9092
  DVD_KAFKA_SCHEMA_REGISTRY_URL: http://schema-registry.kafka.svc.cluster.local:8081
  DVD_SERVICE_AUTH_REALM: IDU
  DVD_SERVICE_AUTH_CLIENT_ID: idu-dvd
  DVD_LOG_LEVEL: INFO
  DVD_LOG_DIR: /tmp/idu-dvd/logs
  DVD_LOG_FILE: app.log
  DVD_UPLOAD_DIR: /tmp/idu-dvd/uploads

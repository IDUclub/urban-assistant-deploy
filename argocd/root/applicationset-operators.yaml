apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: urban-assistant-operators
  namespace: argocd
  annotations: {argocd.argoproj.io/sync-wave: "-25"}
spec:
  syncPolicy:
    # Removing a generator entry must not cascade-delete an already running
    # operator. Resource cleanup is always an explicit reviewed operation.
    preserveResourcesOnDeletion: true
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - matrix:
        generators:
          - git:
              repoURL: https://github.com/IDUclub/urban-assistant-deploy.git
              revision: main
              files:
                - path: operators/releases.yaml
          - list:
              elementsYaml: '{{ .helmReleases | toJson }}'
  template:
    metadata:
      name: 'operator-{{ .name }}'
      labels:
        app.kubernetes.io/part-of: urban-assistant
    spec:
      project: urban-assistant-platform
      sources:
        - repoURL: '{{ .repository }}'
          chart: '{{ .chart }}'
          targetRevision: '{{ .version }}'
          helm:
            releaseName: '{{ .name }}'
            ignoreMissingValueFiles: false
            valueFiles:
              - '$values/{{ .values }}'
        - repoURL: https://github.com/IDUclub/urban-assistant-deploy.git
          targetRevision: main
          ref: values
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{ .namespace }}'
      syncPolicy:
        automated: {enabled: true, prune: true, selfHeal: true, allowEmpty: false}
        syncOptions: [CreateNamespace=true, ServerSideApply=true]
      revisionHistoryLimit: 10
  templatePatch: |
    {{- if hasKey . "vendoredPath" }}
    spec:
      sources:
        - repoURL: https://github.com/IDUclub/urban-assistant-deploy.git
          targetRevision: main
          path: '{{ .vendoredPath }}'
          helm:
            releaseName: '{{ .name }}'
            ignoreMissingValueFiles: false
            valueFiles:
              - '{{ .vendoredValues }}'
    {{- end }}

apiVersion: apps/v1
kind: Deployment
metadata:
  name: chat-storage
  annotations:
    configmap.reloader.stakater.com/reload: chat-storage-config
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: chat-storage
  template:
    metadata:
      labels:
        app.kubernetes.io/name: chat-storage
        app.kubernetes.io/component: api
    spec:
      enableServiceLinks: false
      automountServiceAccountToken: false
      containers:
        - name: api
          image: urban-assistant/chat-storage:base
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: chat-storage-config
            - secretRef:
                name: chat-storage-secrets
          ports:
            - name: http
              containerPort: 8000
          volumeMounts:
            - name: runtime
              mountPath: /tmp/chat-storage
          startupProbe:
            httpGet:
              path: /ping
              port: http
            failureThreshold: 60
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /ping
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: runtime
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: chat-storage
spec:
  selector:
    app.kubernetes.io/name: chat-storage
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: chat-storage-dev
spec:
  type: NodePort
  externalTrafficPolicy: Cluster
  selector:
    app.kubernetes.io/name: chat-storage
  ports:
    - name: http
      port: 8000
      targetPort: http
      nodePort: 31005

name: Validate desired state

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-kubectl@v4
        with:
          version: v1.36.3

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install lint dependencies
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.3 yamllint==1.37.1

      - name: Render and validate repository invariants
        run: python scripts/validate.py --root . --output-dir rendered-ci

      - name: Test promotion contract
        run: python -m unittest discover -s tests -v

      - name: Validate Kubernetes and CRD schemas
        uses: docker://ghcr.io/yannh/kubeconform:v0.8.0
        with:
          entrypoint: /kubeconform
          args: >-
            -strict
            -summary
            -kubernetes-version 1.36.3
            -schema-location https://raw.githubusercontent.com/yannh/kubernetes-json-schema/5a69f8365c9d3ed7de997f5365e22481cf775fa2/{{.NormalizedKubernetesVersion}}-standalone{{.StrictSuffix}}/{{.ResourceKind}}{{.KindSuffix}}.json
            -schema-location https://raw.githubusercontent.com/datreeio/CRDs-catalog/7b1e26ef9deea49293714d204c1a2270aab1178f/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json
            rendered-ci

      - name: Lint YAML
        run: yamllint .

      - name: Lint shell scripts
        run: shellcheck scripts/*.sh

      - name: Lint GitHub Actions
        uses: raven-actions/actionlint@v2

      - name: Scan for committed secrets
        uses: docker://ghcr.io/gitleaks/gitleaks:v8.30.1
        with:
          args: git --redact --verbose --no-banner .

apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: gmart-secrets
spec:
  vaultAuthRef: urban-assistant-dev
  mount: urban-assistant-kv
  type: kv-v2
  path: dev/gmart
  refreshAfter: 1m
  hmacSecretData: true
  destination:
    create: true
    overwrite: false
    name: gmart-secrets
    type: Opaque
    transformation:
      excludes: [".*"]
      templates:
        REDIS_PASSWORD:
          text: '{{ get .Secrets "redis_password" }}'
        REDIS_URL:
          text: 'redis://:{{ get .Secrets "redis_password" }}@gmart-redis:6379/0'
        OLLAMA_API_URL:
          text: '{{ get .Secrets "ollama_api_url" }}'
        OPENAI_BASE_URL:
          text: '{{ get .Secrets "openai_base_url" }}'
        SERVICE_AUTH_SERVER_URL:
          text: '{{ get .Secrets "service_auth_server_url" }}'
        AUTH_HELPER_URL:
          text: '{{ get .Secrets "auth_helper_url" }}'
        SERVICE_AUTH_CLIENT_SECRET:
          text: '{{ get .Secrets "service_auth_client_secret" }}'
        AUTH_HELPER_API_KEY:
          text: '{{ get .Secrets "auth_helper_api_key" }}'
        SYSTEM_PASSWORD:
          text: '{{ get .Secrets "system_password" }}'
  rolloutRestartTargets:
    - kind: Deployment
      name: gmart
    - kind: Deployment
      name: gmart-mcp
    - kind: Deployment
      name: gmart-context-worker
    - kind: StatefulSet
      name: gmart-redis

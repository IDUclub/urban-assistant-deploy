apiVersion: apps/v1
kind: Deployment
metadata:
  name: pzz-beat
  annotations:
    configmap.reloader.stakater.com/reload: pzz-compare-config
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pzz-beat
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pzz-beat
        app.kubernetes.io/component: scheduler
    spec:
      enableServiceLinks: false
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
        - name: init-runtime-dirs
          image: urban-assistant/pzz-compare:base
          imagePullPolicy: IfNotPresent
          command: ["sh", "-ec", "mkdir -p /runtime/outputs /runtime/task_inputs /runtime/uploads"]
          volumeMounts:
            - name: runtime
              mountPath: /runtime
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      containers:
        - name: beat
          image: urban-assistant/pzz-compare:base
          imagePullPolicy: IfNotPresent
          command: ["sh", "-ec"]
          args:
            - python service/wait_for_db.py && exec celery -A service.tasks.celery_app beat --loglevel=INFO --schedule /tmp/celerybeat-schedule
          envFrom:
            - configMapRef:
                name: pzz-compare-config
            - secretRef:
                name: pzz-compare-secrets
          volumeMounts:
            - name: runtime
              mountPath: /app/outputs
              subPath: outputs
            - name: runtime
              mountPath: /app/task_inputs
              subPath: task_inputs
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: runtime
          persistentVolumeClaim:
            claimName: pzz-runtime-data
---
apiVersion: apps/v1
kind: Deployment

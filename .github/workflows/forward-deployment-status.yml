name: Forward deployment status

on:
  status:

permissions:
  contents: read

jobs:
  resolve:
    if: >-
      github.repository == 'IDUclub/urban-assistant-deploy' &&
      startsWith(github.event.context, 'argocd/dev-') &&
      github.event.sender.type == 'Bot'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      eligible: ${{ steps.release.outputs.eligible }}
      service: ${{ steps.release.outputs.service }}
      source-owner: ${{ steps.release.outputs.source-owner }}
      source-name: ${{ steps.release.outputs.source-name }}
      source-sha: ${{ steps.release.outputs.source-sha }}
    steps:
      # Run trusted current scripts; historical manifests are read only as data.
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check PyYAML==6.0.3
      - name: Resolve source commit from the exact deployment revision
        id: release
        run: >-
          python scripts/forward-deployment-status.py resolve
          --event-file "$GITHUB_EVENT_PATH" --github-output "$GITHUB_OUTPUT"

  forward:
    needs: resolve
    if: needs.resolve.outputs.eligible == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      statuses: read
    # Serialize writes to the same source SHA/context, not unrelated releases.
    concurrency:
      group: forward-status-${{ needs.resolve.outputs.service }}-${{ needs.resolve.outputs.source-sha }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check PyYAML==6.0.3
      - name: Create status-only token for the source repository
        id: status-token
        uses: actions/create-github-app-token@v2
        with:
          # Must be the SAME App that publishes Argo's deployment statuses.
          app-id: ${{ secrets.ARGO_STATUS_APP_ID }}
          private-key: ${{ secrets.ARGO_STATUS_PRIVATE_KEY }}
          owner: ${{ needs.resolve.outputs.source-owner }}
          repositories: ${{ needs.resolve.outputs.source-name }}
          permission-statuses: write
      - name: Forward the latest authenticated Argo status
        env:
          DEPLOY_STATUS_TOKEN: ${{ github.token }}
          SOURCE_STATUS_TOKEN: ${{ steps.status-token.outputs.token }}
          ARGO_STATUS_BOT_LOGIN: ${{ steps.status-token.outputs.app-slug }}[bot]
          EXPECTED_SOURCE_REPOSITORY: ${{ needs.resolve.outputs.source-owner }}/${{ needs.resolve.outputs.source-name }}
          EXPECTED_SOURCE_SHA: ${{ needs.resolve.outputs.source-sha }}
        run: >-
          python scripts/forward-deployment-status.py forward
          --event-file "$GITHUB_EVENT_PATH"

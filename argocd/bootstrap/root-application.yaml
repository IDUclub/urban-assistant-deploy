apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: urban-assistant-bootstrap
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/IDUclub/urban-assistant-deploy.git
    targetRevision: main
    # Adoption mode deliberately has no automated sync or prune.
    path: argocd/adoption
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true

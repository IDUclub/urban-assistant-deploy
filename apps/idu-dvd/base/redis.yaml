apiVersion: v1
kind: Service
metadata:
  name: idu-dvd-redis
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: idu-dvd-redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: idu-dvd-redis-data
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: urban-assistant-nfs
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: idu-dvd-redis
spec:
  serviceName: idu-dvd-redis
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: idu-dvd-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: idu-dvd-redis
        app.kubernetes.io/component: cache
    spec:
      enableServiceLinks: false
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: redis
          image: redis:7.4-alpine
          imagePullPolicy: IfNotPresent
          command: ["sh", "-ec"]
          args:
            - exec redis-server --appendonly yes --requirepass "$REDIS_PASSWORD"
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: idu-dvd-secrets
                  key: REDIS_PASSWORD
          ports:
            - name: redis
              containerPort: 6379
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            exec:
              command: ["sh", "-ec", "redis-cli -a \"$REDIS_PASSWORD\" ping | grep -qx PONG"]
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["sh", "-ec", "redis-cli -a \"$REDIS_PASSWORD\" ping | grep -qx PONG"]
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: idu-dvd-redis-data

apiVersion: batch/v1
kind: Job
metadata:
  name: urban-api-smoke-test
  labels:
    app.kubernetes.io/name: urban-api
    app.kubernetes.io/component: smoke-test
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: urban-api
        app.kubernetes.io/component: smoke-test
    spec:
      restartPolicy: Never
      enableServiceLinks: false
      automountServiceAccountToken: false
      containers:
        - name: smoke-test
          image: urban-assistant/urban-api:base
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-ec"]
          args:
            - |
              attempt=1
              while [ "$attempt" -le 24 ]; do
                if curl --fail --silent --show-error --max-time 5 \
                  http://urban-api:8000/health_check/db; then
                  echo
                  echo "Urban API smoke test passed"
                  exit 0
                fi

                echo "Urban API smoke test attempt $attempt/24 failed" >&2
                attempt=$((attempt + 1))
                sleep 5
              done

              echo "Urban API smoke test failed" >&2
              exit 1
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault

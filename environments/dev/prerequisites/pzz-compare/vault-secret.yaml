# Vault Secrets Operator materializes runtime credentials for every PZZ process.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: pzz-compare-secrets
spec:
  vaultAuthRef: urban-assistant-dev
  mount: urban-assistant-kv
  type: kv-v2
  path: dev/pzz-compare
  refreshAfter: 1m
  hmacSecretData: true
  destination:
    create: true
    overwrite: false
    name: pzz-compare-secrets
    type: Opaque
    transformation:
      excludes: [".*"]
      templates:
        REDIS_PASSWORD:
          text: '{{ get .Secrets "redis_password" }}'
        REDIS_URL:
          text: 'redis://:{{ get .Secrets "redis_password" }}@pzz-redis:6379/0'
        DATABASE_URL:
          text: '{{ get .Secrets "database_url" }}'
        OLLAMA_BASE_URL:
          text: '{{ get .Secrets "ollama_base_url" }}'
        VLLM_BASE_URL:
          text: '{{ get .Secrets "vllm_base_url" }}'
        VECTORIZER_URL:
          text: '{{ get .Secrets "vectorizer_url" }}'
        PUBLIC_BASE_URL:
          text: '{{ get .Secrets "public_base_url" }}'
        AUTH_SERVER_URL:
          text: '{{ get .Secrets "auth_server_url" }}'
        KEYCLOAK_URL:
          text: '{{ get .Secrets "keycloak_url" }}'
        FILESERVER_ENDPOINT:
          text: '{{ get .Secrets "fileserver_endpoint" }}'
        VLLM_API_KEY:
          text: '{{ get .Secrets "vllm_api_key" }}'
        FILESERVER_ACCESS_KEY:
          text: '{{ get .Secrets "fs_access_key" }}'
        FILESERVER_SECRET_KEY:
          text: '{{ get .Secrets "fs_secret_key" }}'
        KEYCLOAK_CLIENT_SECRET:
          text: '{{ get .Secrets "keycloak_client_secret" }}'
        ADMIN_API_TOKEN:
          text: '{{ get .Secrets "admin_api_token" }}'
  rolloutRestartTargets:
    - kind: Deployment
      name: pzz-compare
    - kind: Deployment
      name: pzz-worker
    - kind: Deployment
      name: pzz-worker-llm
    - kind: Deployment
      name: pzz-beat
    - kind: Deployment
      name: pzz-mcp
    - kind: StatefulSet
      name: pzz-redis

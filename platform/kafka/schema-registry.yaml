apiVersion: apps/v1
kind: Deployment
metadata:
  name: schema-registry
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: schema-registry
  template:
    metadata:
      labels:
        app.kubernetes.io/name: schema-registry
        app.kubernetes.io/component: messaging
    spec:
      # Prevents Kubernetes service variables such as SCHEMA_REGISTRY_PORT from
      # colliding with the Confluent image configuration script.
      enableServiceLinks: false
      automountServiceAccountToken: false
      initContainers:
        - name: wait-for-kafka
          image: confluentinc/cp-schema-registry:8.2.2-1-ubi9
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "-ec"]
          args:
            - until (echo > /dev/tcp/urban-assistant-kafka-kafka-bootstrap.kafka.svc.cluster.local/9092) 2>/dev/null; do echo "Waiting for Kafka"; sleep 5; done
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
      containers:
        - name: schema-registry
          image: confluentinc/cp-schema-registry:8.2.2-1-ubi9
          imagePullPolicy: IfNotPresent
          env:
            - name: SCHEMA_REGISTRY_HOST_NAME
              value: schema-registry
            - name: SCHEMA_REGISTRY_LISTENERS
              value: http://0.0.0.0:8081
            - name: SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS
              value: urban-assistant-kafka-kafka-bootstrap.kafka.svc.cluster.local:9092
            - name: SCHEMA_REGISTRY_KAFKASTORE_TOPIC
              value: _schemas
            - name: SCHEMA_REGISTRY_HEAP_OPTS
              value: -Xms256M -Xmx512M
          ports:
            - name: http
              containerPort: 8081
          startupProbe:
            httpGet:
              path: /subjects
              port: http
            failureThreshold: 60
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /subjects
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /subjects
              port: http
            initialDelaySeconds: 60
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
---
apiVersion: v1
kind: Service
metadata:
  name: schema-registry
spec:
  selector:
    app.kubernetes.io/name: schema-registry
  ports:
    - name: http
      port: 8081
      targetPort: http

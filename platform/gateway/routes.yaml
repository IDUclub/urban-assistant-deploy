apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: urban-assistant-http-redirect
  namespace: urban-assistant-dev
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: urban-assistant-dev
      sectionName: http
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            port: 31302
            statusCode: 308
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: urban-assistant-https
  namespace: urban-assistant-dev
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: urban-assistant-dev
      sectionName: https
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /urban-api
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /api/v1
      backendRefs:
        - group: ""
          kind: Service
          name: urban-api
          port: 8000
          weight: 1
    - matches:
        - path:
            type: PathPrefix
            value: /gmart
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - group: ""
          kind: Service
          name: gmart
          port: 8080
          weight: 1
    - matches:
        - path:
            type: PathPrefix
            value: /chat-storage
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /api/v1
      backendRefs:
        - group: ""
          kind: Service
          name: chat-storage
          port: 8000
          weight: 1
    - matches:
        - path:
            type: PathPrefix
            value: /pzz-compare
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - group: ""
          kind: Service
          name: pzz-compare
          port: 8000
          weight: 1
    - matches:
        - path:
            type: PathPrefix
            value: /genbuilder
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - group: ""
          kind: Service
          name: genbuilder
          port: 8000
          weight: 1
    - matches:
        - path:
            type: PathPrefix
            value: /genplanner
      # GenPlanner serves its API under /genplanner; preserve this prefix.
      backendRefs:
        - group: ""
          kind: Service
          name: genplanner
          port: 8080
          weight: 1
    - matches:
        - path:
            type: PathPrefix
            value: /idu-dvd
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - group: ""
          kind: Service
          name: idu-dvd
          port: 8000
          weight: 1
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: urban-assistant-frontend
          port: 3000
          weight: 1
---
# gMART, PZZ, GenBuilder and GenPlanner use long-lived SSE responses.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: urban-assistant-streaming-timeout
  namespace: urban-assistant-dev
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: urban-assistant-https
  timeout:
    http:
      requestTimeout: 0s

apiVersion: apps/v1
kind: Deployment
metadata:
  name: urban-assistant-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: urban-assistant-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: urban-assistant-frontend
        app.kubernetes.io/component: frontend
    spec:
      enableServiceLinks: false
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: frontend
          image: urban-assistant/frontend:base
          imagePullPolicy: IfNotPresent
          env:
            - name: PORT
              value: "3000"
          ports:
            - name: http
              containerPort: 3000
          startupProbe:
            httpGet:
              path: /
              port: http
            failureThreshold: 60
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: urban-assistant-frontend
spec:
  selector:
    app.kubernetes.io/name: urban-assistant-frontend
  ports:
    - name: http
      port: 3000
      targetPort: http

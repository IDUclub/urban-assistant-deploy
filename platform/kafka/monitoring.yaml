apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: kafka
spec:
  namespaceSelector:
    matchNames: [kafka]
  selector:
    matchExpressions:
      - key: strimzi.io/kind
        operator: In
        values: [Kafka]
  podMetricsEndpoints:
    - path: /metrics
      port: tcp-prometheus
      interval: 30s

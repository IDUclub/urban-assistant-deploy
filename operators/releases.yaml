# Urban Assistant-scoped releases consumed by the operator ApplicationSet.
helmReleases:
  - name: strimzi-cluster-operator
    namespace: kafka
    repository: https://strimzi.io/charts/
    chart: strimzi-kafka-operator
    version: 1.1.0
    values: operators/strimzi-values.yaml
  - name: kube-prometheus-stack
    namespace: monitoring
    repository: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    version: 87.21.0
    values: operators/kube-prometheus-stack-values.yaml
  - name: jaeger
    namespace: monitoring
    repository: https://jaegertracing.github.io/helm-charts
    chart: jaeger
    version: 4.12.0
    values: operators/jaeger-values.yaml
  - name: otel-collector
    namespace: monitoring
    repository: https://open-telemetry.github.io/opentelemetry-helm-charts
    chart: opentelemetry-collector
    version: 0.165.0
    values: operators/otel-collector-values.yaml
  - name: reloader
    namespace: urban-assistant-dev
    repository: https://stakater.github.io/stakater-charts
    chart: reloader
    version: 2.2.12
    values: operators/reloader-values.yaml
